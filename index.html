<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Internet Connectivity Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="card">
        <h2>🌐 Internet Status Checker</h2>
        <p class="subtitle">Click the button to test your internet connection</p>

        <div id="statusIcon" class="status-icon idle"></div>
        <p id="statusText" class="status-text">Waiting for input...</p>

        <button onclick="checkConnection()" class="btn">Check Connection</button>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>

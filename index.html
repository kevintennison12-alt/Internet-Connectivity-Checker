<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Website Connectivity Checker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <div class="card">
        <h2>🌐 Internet Connectivity Checker</h2>

        <input type="text" id="urlInput" placeholder="Enter website URL (example: google.com)">
        
        <button onclick="checkConnectivity()" class="btn">Check Connectivity</button>

        <div id="resultBox" class="result hidden">
            <h3 id="statusText"></h3>
            <p id="pingText"></p>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
